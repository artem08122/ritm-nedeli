<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Ритм недели — Telegram Mini App</title>
<link rel="manifest" href="manifest.json">
<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Mock for local testing outside Telegram -->
<script>
/* tg-mock.js — Полноценный эмулятор Telegram.WebApp для запуска вне Telegram */
(function(window) {
  'use strict';

  // Если приложение уже открыто внутри настоящего Telegram Mini App — не переопределяем
  if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
    console.log('[TMA] Running inside native Telegram WebApp');
    return;
  }

  console.log('[TMA] Initializing Telegram.WebApp Mock for browser testing');

  var listeners = {};
  function emit(event, data) {
    if (listeners[event]) {
      listeners[event].forEach(function(fn) {
        try { fn(data); } catch (e) { console.error(e); }
      });
    }
  }

  var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var themeParamsDark = {
    bg_color: '#000000',
    secondary_bg_color: '#1C1C1E',
    text_color: '#F2F2F7',
    hint_color: '#8E8E93',
    link_color: '#0A84FF',
    button_color: '#0A84FF',
    button_text_color: '#FFFFFF'
  };
  var themeParamsLight = {
    bg_color: '#F2F2F7',
    secondary_bg_color: '#FFFFFF',
    text_color: '#1C1C1E',
    hint_color: '#8E8E93',
    link_color: '#0A84FF',
    button_color: '#0A84FF',
    button_text_color: '#FFFFFF'
  };

  var mainButtonListeners = [];
  var backButtonListeners = [];

  var MainButton = {
    text: '',
    color: '#0A84FF',
    textColor: '#FFFFFF',
    isVisible: false,
    isActive: true,
    isProgressVisible: false,
    setText: function(t) { this.text = t; updateMockBar(); return this; },
    onClick: function(fn) { mainButtonListeners.push(fn); return this; },
    offClick: function(fn) { mainButtonListeners = mainButtonListeners.filter(function(x) { return x !== fn; }); return this; },
    show: function() { this.isVisible = true; updateMockBar(); return this; },
    hide: function() { this.isVisible = false; updateMockBar(); return this; },
    enable: function() { this.isActive = true; updateMockBar(); return this; },
    disable: function() { this.isActive = false; updateMockBar(); return this; }
  };

  var BackButton = {
    isVisible: false,
    onClick: function(fn) { backButtonListeners.push(fn); return this; },
    offClick: function(fn) { backButtonListeners = backButtonListeners.filter(function(x) { return x !== fn; }); return this; },
    show: function() { this.isVisible = true; updateMockBar(); return this; },
    hide: function() { this.isVisible = false; updateMockBar(); return this; }
  };

  var HapticFeedback = {
    impactOccurred: function(style) {
      console.log('[Mock Haptic] impactOccurred:', style);
    },
    notificationOccurred: function(type) {
      console.log('[Mock Haptic] notificationOccurred:', type);
    },
    selectionChanged: function() {
      console.log('[Mock Haptic] selectionChanged');
    }
  };

  var CloudStorage = {
    getItem: function(key, callback) {
      var val = localStorage.getItem('tg_cloud_' + key);
      setTimeout(function() { if (callback) callback(null, val); }, 10);
    },
    setItem: function(key, value, callback) {
      localStorage.setItem('tg_cloud_' + key, value);
      setTimeout(function() { if (callback) callback(null, true); }, 10);
    },
    removeItem: function(key, callback) {
      localStorage.removeItem('tg_cloud_' + key);
      setTimeout(function() { if (callback) callback(null, true); }, 10);
    },
    getKeys: function(callback) {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf('tg_cloud_') === 0) keys.push(k.slice(9));
      }
      setTimeout(function() { if (callback) callback(null, keys); }, 10);
    }
  };

  var WebApp = {
    initData: 'query_id=AAHdF6IQAAAAAN0XohC_mock&user=%7B%22id%22%3A12345678%2C%22first_name%22%3A%22%D0%90%D1%80%D1%82%D1%91%D0%BC%22%2C%22last_name%22%3A%22%22%2C%22username%22%3A%22artem%22%2C%22language_code%22%3A%22ru%22%7D',
    initDataUnsafe: {
      user: {
        id: 12345678,
        first_name: 'Артём',
        last_name: '',
        username: 'artem',
        language_code: 'ru'
      }
    },
    version: '7.10',
    platform: 'mock',
    colorScheme: isDark ? 'dark' : 'light',
    themeParams: isDark ? themeParamsDark : themeParamsLight,
    isExpanded: true,
    viewportHeight: window.innerHeight,
    viewportStableHeight: window.innerHeight,
    headerColor: isDark ? '#000000' : '#F2F2F7',
    backgroundColor: isDark ? '#000000' : '#F2F2F7',
    MainButton: MainButton,
    BackButton: BackButton,
    HapticFeedback: HapticFeedback,
    CloudStorage: CloudStorage,
    ready: function() { console.log('[Mock WebApp] ready() called'); },
    expand: function() { console.log('[Mock WebApp] expand() called'); },
    close: function() { console.log('[Mock WebApp] close() called'); },
    setHeaderColor: function(c) { this.headerColor = c; },
    setBackgroundColor: function(c) { this.backgroundColor = c; },
    onEvent: function(eventType, eventHandler) {
      if (!listeners[eventType]) listeners[eventType] = [];
      listeners[eventType].push(eventHandler);
    },
    offEvent: function(eventType, eventHandler) {
      if (listeners[eventType]) {
        listeners[eventType] = listeners[eventType].filter(function(x) { return x !== eventHandler; });
      }
    },
    sendData: function(data) {
      console.log('[Mock WebApp] sendData:', data);
    },
    toggleTheme: function(theme) {
      if (theme) isDark = (theme === 'dark');
      else isDark = !isDark;
      this.colorScheme = isDark ? 'dark' : 'light';
      this.themeParams = isDark ? themeParamsDark : themeParamsLight;
      emit('themeChanged');
    }
  };

  function updateMockBar() {
    var bar = document.getElementById('tg-mock-bar');
    if (!bar) return;
    var btn = bar.querySelector('.tg-mock-main-btn');
    var back = bar.querySelector('.tg-mock-back-btn');
    if (btn) {
      btn.style.display = MainButton.isVisible ? 'block' : 'none';
      btn.textContent = MainButton.text;
      btn.disabled = !MainButton.isActive;
    }
    if (back) {
      back.style.display = BackButton.isVisible ? 'inline-block' : 'none';
    }
  }

  window.Telegram = window.Telegram || {};
  window.Telegram.WebApp = WebApp;

})(window);

</script>
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--card2:#F7F7FA;--ink:#1C1C1E;--muted:#8E8E93;--line:rgba(60,60,67,.14);
  --accent:#0A84FF;--on:#fff;--radius:22px;--glass:rgba(255,255,255,.72);--shadow:0 6px 24px rgba(0,0,0,.07);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--ink:#F2F2F7;--muted:#8E8E93;--line:rgba(235,235,245,.16);
  --glass:rgba(28,28,30,.72);--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--card2:#2C2C2E;--ink:#F2F2F7;--muted:#8E8E93;--line:rgba(235,235,245,.16);--glass:rgba(28,28,30,.72);--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:6px 2px 4px;font-weight:800}
h2{font-size:21px;letter-spacing:-.01em;margin:0 0 8px;font-weight:700}
h3{font-size:16px;margin:0;font-weight:650}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{border:0;background:var(--accent);color:var(--on);border-radius:14px;padding:0 18px;min-height:44px;font-weight:650;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.danger{background:#FF453A;color:#fff}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:11px}
.input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:96px;resize:vertical}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:6px 12px;font-size:14px;min-height:34px;transition:background .15s}
.chip.on{background:var(--accent);color:var(--on);border-color:transparent}
.seg{display:flex;gap:3px;padding:3px;background:var(--card2);border-radius:13px;margin:0 0 12px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.pbar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));flex:none}

/* hero bar */
#heroBar{position:sticky;top:0;z-index:20;margin:0 -14px 12px;padding:calc(env(safe-area-inset-top,0px) + var(--tg-top,0px) + 8px) 14px 8px;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line)}
#heroBar .hb{display:flex;gap:10px;align-items:center}
#heroCanvas{width:132px;height:88px;border-radius:16px;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--card2);flex:none;transition:width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1)}
#heroBar.big .hb{flex-direction:column;align-items:stretch}
#heroBar.big #heroCanvas{width:100%;height:auto;aspect-ratio:96/64}
.bubble{position:relative;background:var(--card);border-radius:18px;padding:10px 12px;font-size:14.5px;line-height:1.35;box-shadow:var(--shadow);flex:1;min-width:0;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.bubble::before{content:"";position:absolute;left:-6px;top:22px;width:12px;height:12px;background:var(--card);transform:rotate(45deg);border-radius:3px}
#heroBar.big .bubble::before{display:none}
.hmeta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
.hmeta .pbar{flex:1;height:6px}
.hbtns{display:flex;gap:6px;margin-left:auto}
.hbtns button{border:0;background:var(--card2);border-radius:10px;min-width:34px;min-height:30px;font-size:15px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line)}
#tabs .in{display:flex;width:100%;max-width:560px}
#tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-height:48px;padding:4px 0}
#tabs button svg{width:25px;height:25px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#tabs button.on{color:var(--accent)}
#tabs button.on svg{transform:translateY(-2px) scale(1.12)}

/* tasks */
.sechead{display:flex;align-items:center;gap:8px;margin:14px 4px 6px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--c,var(--accent));background:transparent;flex:none;position:relative;display:grid;place-items:center;padding:0;transition:background .2s,transform .25s cubic-bezier(.3,1.8,.5,1)}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .05s}
.chk.on{background:var(--c,var(--accent));transform:scale(1.12)}
.chk.on svg{stroke-dashoffset:0}
.chk.bounce{animation:bounce .55s cubic-bezier(.3,1.8,.5,1)}
@keyframes bounce{0%{transform:scale(.7)}50%{transform:scale(1.45)}100%{transform:scale(1.12)}}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{color:var(--muted);text-decoration:line-through}
.task .tools{display:flex;gap:4px}
.task .tools button{border:0;background:none;color:var(--muted);font-size:15px;min-width:32px;min-height:32px;border-radius:9px}
.task .tools button.arm{background:#FF453A;color:#fff}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

/* grid cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scard{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:124px;color:var(--ink);transition:transform .15s}
.scard:active{transform:scale(.97)}
.scard .ic{width:34px;height:34px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center}
.scard .ic svg{width:20px;height:20px}
.ring{position:relative;width:var(--s,64px);height:var(--s,64px);flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bg{stroke:var(--card2)}
.ring .fg{stroke:var(--c,var(--accent));transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.stat{background:var(--card2);border-radius:14px;padding:10px 12px;flex:1;min-width:84px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.flame{display:flex;justify-content:space-between;gap:6px;margin:6px 0}
.flame div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.flame i{display:block;height:34px;border-radius:12px;background:var(--card2);margin-bottom:4px;display:grid;place-items:center;font-style:normal;font-size:17px}
.flame i.on{background:var(--accent);color:#fff}
.flame i.today{outline:2px solid var(--accent);outline-offset:2px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:7px;background:var(--card2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--card2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--card2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--card2))}
.heat i.l4{background:var(--accent)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.ach div{background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px}
.ach div b{display:block;font-size:26px}
.ach div.lock{opacity:.35;filter:grayscale(1)}
.ward{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ward:first-child{border-top:0}
.ward.lock{opacity:.45}

/* sheets, toast, fx */
#sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
#sheet .in{width:100%;max-width:560px;height:80vh;background:var(--bg);border-radius:24px 24px 0 0;padding:14px;display:flex;flex-direction:column;gap:10px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on)}
.msg.hero{align-self:flex-start;background:var(--card)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%) translateY(-120px);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:650;max-width:92vw;text-align:center;transition:transform .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none;width:100%;height:100%}
.xp{position:fixed;z-index:95;font-weight:800;font-size:22px;color:var(--c,#FFD60A);text-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none;animation:xpup 1.3s ease-out forwards}
@keyframes xpup{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.25);opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
.lvl{position:fixed;inset:0;z-index:92;display:grid;place-items:center;background:rgba(0,0,0,.55);animation:fade .3s}
.lvl>div{background:var(--card);border-radius:28px;padding:28px 34px;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.lvl b{display:block;font-size:56px;letter-spacing:-.03em}
@keyframes fade{from{opacity:0}to{opacity:1}}
.quest{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

#heroBar.big{position:static;margin-bottom:12px;border-radius:0 0 26px 26px;border-bottom:0;background:var(--card)}
#heroBar.big .bubble{margin-top:2px}

#tabs button{font-size:10px;min-width:0;padding:4px 0}
#tabs button svg{width:22px;height:22px}

/* режим внешнего экрана (крышка): только герой и реплика */
body.cover{background:#14161c;overflow:hidden}
body.cover #view,body.cover #tabs,body.cover .hbtns,body.cover .hmeta{display:none!important}
body.cover #app{height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0}
body.cover #heroBar{position:static;margin:0;padding:0;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;width:100%}
body.cover #heroBar .hb{flex-direction:column;align-items:center;gap:12px;padding:8px 14px 0}
body.cover #heroCanvas{width:min(92vw,40vh*1.5);height:auto;aspect-ratio:96/64;border-radius:24px}
body.cover .bubble{font-size:16px;line-height:1.3;padding:10px 14px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;border-radius:22px;width:100%;max-width:560px;text-align:center;flex:none}
body.cover .bubble::before{display:none}

.scard.part{background:color-mix(in srgb,var(--c) 22%,var(--card));box-shadow:inset 0 0 0 1.5px var(--c),var(--shadow)}
.scard.full{background:var(--c);color:#fff}
.scard.full .muted,.scard.full .today-tag{color:rgba(255,255,255,.88)}
.scard.full .ic{background:rgba(255,255,255,.25)}
.scard .today-tag{font-size:12px;font-weight:600;color:var(--c);margin-top:auto}
.card.must{border:1.5px solid #FF453A;background:color-mix(in srgb,#FF453A 8%,var(--card))}
.card.must h2{color:#FF453A;font-size:17px}

.scard .yday-tag{font-size:12px;font-weight:600;opacity:.8;color:var(--c)}
.scard.full .yday-tag{color:rgba(255,255,255,.88)}
.card.carry{box-shadow:inset 0 0 0 1.5px #FF9F0A,var(--shadow)}
.card.yday .task{opacity:.7}

/* ===== Telegram Mini App адаптация и дополнения ===== */
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  overflow-x: hidden;
  touch-action: manipulation;
}

/* Счётчик для привычек N раз */
.cnt-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--card2);
  border-radius: 12px;
  padding: 2px 6px;
  flex: none;
}
.cnt-btn {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  border: 0;
  background: var(--card);
  color: var(--ink);
  font-size: 16px;
  font-weight: 700;
  display: grid;
  place-items: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.cnt-btn:active { transform: scale(.92); }
.cnt-val {
  font-size: 13.5px;
  font-weight: 700;
  min-width: 48px;
  text-align: center;
  color: var(--ink);
}

/* Иконки в задачах */
.task-ic {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  background: var(--card2);
  overflow: hidden;
}
.task-ic svg {
  width: 26px;
  height: 26px;
}
.task-ic span {
  font-size: 20px;
}

/* Модальные окна */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.modal-box {
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  background: var(--card);
  border-radius: 24px 24px 0 0;
  padding: 20px 18px calc(24px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  box-shadow: 0 -8px 32px rgba(0,0,0,.25);
  animation: up .3s cubic-bezier(.2,.8,.2,1);
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-head h2 { margin: 0; font-size: 20px; }
.modal-close {
  border: 0;
  background: var(--card2);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 16px;
  display: grid;
  place-items: center;
  color: var(--muted);
}

/* Выбор цветов */
.color-picker {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 6px 0;
}
.color-dot {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid transparent;
  cursor: pointer;
  transition: transform .15s;
}
.color-dot:active { transform: scale(.9); }
.color-dot.on {
  border-color: var(--ink);
  transform: scale(1.12);
}

/* Пикер иконок */
.icon-preview-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 14px;
  min-height: 48px;
  width: 100%;
  text-align: left;
}
.icon-preview-box {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.icon-preview-box svg { width: 32px; height: 32px; }

.icon-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  max-height: 52vh;
  overflow-y: auto;
  padding: 4px;
}
.icon-item {
  aspect-ratio: 1;
  background: var(--card2);
  border: 1.5px solid transparent;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px;
  cursor: pointer;
  transition: transform .15s;
}
.icon-item:active { transform: scale(.92); }
.icon-item.on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 15%, var(--card2));
}
.icon-item svg { width: 34px; height: 34px; }
.icon-item .ic-label { font-size: 10px; color: var(--muted); margin-top: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Онбординг */
.onboard-screen {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: var(--bg);
  overflow-y: auto;
  padding: calc(var(--safe-top) + 20px) 18px calc(var(--safe-bottom) + 24px);
  display: flex;
  flex-direction: column;
  max-width: 560px;
  margin: 0 auto;
}
.onboard-head {
  text-align: center;
  margin-bottom: 20px;
}
.onboard-head h1 { font-size: 26px; margin-bottom: 8px; }
.onboard-head p { color: var(--muted); font-size: 14.5px; line-height: 1.4; }
.template-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform .15s, border-color .2s;
}
.template-item.on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, var(--card));
}
.template-item .tpl-ic {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  background: var(--card2);
}
.template-item .tpl-ic svg { width: 36px; height: 36px; }

/* Карточка питомца */
.pet-card {
  background: var(--card2);
  border: 2px solid transparent;
  border-radius: 18px;
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  cursor: pointer;
  transition: transform .15s, border-color .2s;
}
.pet-card:active { transform: scale(.95); }
.pet-card.on {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 12%, var(--card2));
}
.pet-card-icon {
  font-size: 32px;
}

/* 12-недельная тепловая карта */
.heatmap-container {
  overflow-x: auto;
  padding: 6px 2px 10px;
}
.heatmap-grid {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(7, 13px);
  grid-auto-columns: 13px;
  gap: 4px;
  width: max-content;
}
.heatmap-cell {
  width: 13px;
  height: 13px;
  border-radius: 3.5px;
  background: var(--card2);
}
.heatmap-cell.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--card2)); }
.heatmap-cell.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--card2)); }
.heatmap-cell.l3 { background: color-mix(in srgb, var(--accent) 80%, var(--card2)); }
.heatmap-cell.l4 { background: var(--accent); }
.heatmap-cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }

/* Переключатели дней недели в редакторе */
.days-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.day-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card2);
  color: var(--ink);
  font-weight: 600;
  font-size: 13px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.day-btn.on {
  background: var(--accent);
  color: #FFFFFF;
  border-color: transparent;
}

/* storage.js — Асинхронное хранилище Telegram CloudStorage + fallback на localStorage */
(function(window) {
  'use strict';

  var STORAGE_KEY = 'ritm_tma_state_v1';

  function isTgCloudAvailable() {
    return !!(window.Telegram &&
              window.Telegram.WebApp &&
              window.Telegram.WebApp.CloudStorage &&
              typeof window.Telegram.WebApp.CloudStorage.getItem === 'function');
  }

  function loadState(callback) {
    if (isTgCloudAvailable()) {
      try {
        window.Telegram.WebApp.CloudStorage.getItem(STORAGE_KEY, function(err, value) {
          if (!err && value) {
            try {
              var parsed = JSON.parse(value);
              localStorage.setItem(STORAGE_KEY, value); // синхронизируем локально
              callback(null, parsed);
              return;
            } catch (e) {}
          }
          // Fallback на localStorage при ошибке или пустоте в облаке
          fallbackLocalLoad(callback);
        });
        return;
      } catch (e) {}
    }
    fallbackLocalLoad(callback);
  }

  function fallbackLocalLoad(callback) {
    try {
      var localRaw = localStorage.getItem(STORAGE_KEY);
      if (localRaw) {
        var parsed = JSON.parse(localRaw);
        callback(null, parsed);
        return;
      }
    } catch (e) {}
    callback(null, null);
  }

  function saveState(state, callback) {
    var serialized = JSON.stringify(state);
    // Всегда пишем в localStorage
    try {
      localStorage.setItem(STORAGE_KEY, serialized);
    } catch (e) {
      console.warn('localStorage save error:', e);
    }

    // Пишем в CloudStorage, если доступно
    if (isTgCloudAvailable()) {
      try {
        window.Telegram.WebApp.CloudStorage.setItem(STORAGE_KEY, serialized, function(err, success) {
          if (callback) callback(err, success);
        });
        return;
      } catch (e) {
        console.warn('CloudStorage setItem error:', e);
      }
    }

    if (callback) callback(null, true);
  }

  function exportJSON(state) {
    return JSON.stringify(state, null, 2);
  }

  function importJSON(jsonStr) {
    try {
      var obj = JSON.parse(jsonStr);
      if (obj && typeof obj === 'object' && Array.isArray(obj.sections)) {
        return obj;
      }
    } catch (e) {}
    return null;
  }

  function clearAll(callback) {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {}

    if (isTgCloudAvailable()) {
      try {
        window.Telegram.WebApp.CloudStorage.removeItem(STORAGE_KEY, function(err, success) {
          if (callback) callback(err, success);
        });
        return;
      } catch (e) {}
    }
    if (callback) callback(null, true);
  }

  window.RitmStorage = {
    loadState: loadState,
    saveState: saveState,
    exportJSON: exportJSON,
    importJSON: importJSON,
    clearAll: clearAll,
    isTgCloudAvailable: isTgCloudAvailable
  };

})(window);

    fxCtx = c.getContext('2d');
    window.addEventListener('resize', function () {
      c.width = window.innerWidth;
      c.height = window.innerHeight;
    });
    requestAnimationFrame(renderFx);
  }

  function celebrate(x, y) {
    if (!fxCtx) return;
    var colors = ['#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6', '#F43F5E'];
    for (var i = 0; i < 45; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 3 + Math.random() * 8;
      confetti.push({
        x: x || window.innerWidth / 2,
        y: y || window.innerHeight / 2,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 2,
        size: 4 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1,
        rot: Math.random() * 360,
        vrot: (Math.random() - 0.5) * 12
      });
    }
  }

  function renderFx() {
    if (fxCtx && confetti.length) {
      fxCtx.clearRect(0, 0, fxCtx.canvas.width, fxCtx.canvas.height);
      for (var i = confetti.length - 1; i >= 0; i--) {
        var p = confetti[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.25; // gravity
        p.rot += p.vrot;
        p.life -= 0.02;
        if (p.life <= 0) {
          confetti.splice(i, 1);
          continue;
        }
        fxCtx.save();
        fxCtx.globalAlpha = Math.max(0, p.life);
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate((p.rot * Math.PI) / 180);
        fxCtx.fillStyle = p.color;
        fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        fxCtx.restore();
      }
    }
    requestAnimationFrame(renderFx);
  }

  /* ---------- ПРИВЫЧКИ И РАСПИСАНИЕ ---------- */
  function getScheduledHabits(dateStr) {
    var d = parseDate(dateStr);
    var dw = dayOfWeek(d); // 0..6
    return state.habits.filter(function (h) {
      if (h.archived) return false;
      if (h.days === 'all' || !h.days) return true;
      if (Array.isArray(h.days)) return h.days.indexOf(dw) >= 0;
      return true;
    });
  }

  function isHabitDone(habitId, dateStr) {
    var log = (state.logs[dateStr] && state.logs[dateStr][habitId]) || null;
    return !!(log && log.done);
  }

  function getHabitVal(habitId, dateStr) {
    var log = (state.logs[dateStr] && state.logs[dateStr][habitId]) || null;
    return log ? log.val || 0 : 0;
  }

  function toggleHabit(habit, e) {
    var today = todayKey();
    if (!state.logs[today]) state.logs[today] = {};
    var log = state.logs[today][habit.id] || { done: false, val: 0, xp: 0 };

    if (!log.done) {
      // Отметка выполнена
      log.done = true;
      log.val = habit.target || 1;
      log.xp = 10;
      state.totalDone++;
      if (habit.type === 'counter') state.counterCompleted++;
      addXP(10, e);
      updateStreakOnActivity();
      celebrate(e ? e.clientX : null, e ? e.clientY : null);
      setHeroSpeech(Content.reply('done', { section: habit.sectionId }));
      toast(I18n.t('toastHabitDone', { xp: 10 }));
    } else {
      // Снятие отметки
      log.done = false;
      log.val = 0;
      state.totalDone = Math.max(0, state.totalDone - 1);
      state.xp = Math.max(0, state.xp - (log.xp || 10));
      log.xp = 0;
      toast(I18n.t('toastHabitUndone'));
    }

    state.logs[today][habit.id] = log;
    checkPerfectDay(today);
    updateHeroMood();
    save();
    rerenderSoft();
  }

  function stepCounter(habit, delta, e) {
    var today = todayKey();
    if (!state.logs[today]) state.logs[today] = {};
    var log = state.logs[today][habit.id] || { done: false, val: 0, xp: 0 };
    var prevVal = log.val || 0;
    var target = habit.target || 1;
    var newVal = Math.max(0, prevVal + delta);
    log.val = newVal;

    if (newVal >= target && !log.done) {
      log.done = true;
      log.xp = 15;
      state.totalDone++;
      state.counterCompleted++;
      addXP(15, e);
      updateStreakOnActivity();
      celebrate(e ? e.clientX : null, e ? e.clientY : null);
      setHeroSpeech(Content.reply('done', { section: habit.sectionId }));
      toast(I18n.t('toastHabitDone', { xp: 15 }));
    } else if (newVal < target && log.done) {
      log.done = false;
      state.totalDone = Math.max(0, state.totalDone - 1);
      state.xp = Math.max(0, state.xp - (log.xp || 15));
      log.xp = 0;
    } else {
      hapticImpact('light');
    }

    state.logs[today][habit.id] = log;
    checkPerfectDay(today);
    updateHeroMood();
    save();
    rerenderSoft();
  }

  function checkPerfectDay(dateStr) {
    var scheduled = getScheduledHabits(dateStr);
    if (!scheduled.length) return;
    var allDone = scheduled.every(function (h) { return isHabitDone(h.id, dateStr); });
    if (allDone) {
      state.perfectDays = (state.perfectDays || 0) + 1;
      setHeroSpeech(Content.reply('perfectDay'));
      celebrate(window.innerWidth / 2, window.innerHeight / 2);
    }
  }

  /* ---------- ОСНОВНОЙ РЕНДЕР ---------- */
  function render() {
    var v = $('view');
    if (!v) return;
    v.textContent = '';

    // Проверяем онбординг
    if (!state.user.onboarded) {
      showOnboarding();
      return;
    } else {
      hideOnboarding();
    }

    if (ui.tab === 'today') renderToday(v);
    else if (ui.tab === 'week') renderWeek(v);
    else if (ui.tab === 'sections') renderSections(v);
    else if (ui.tab === 'stats') renderStats(v);
    else if (ui.tab === 'hero') renderHero(v);
    else if (ui.tab === 'settings') renderSettings(v);

    buildTabs();
    updateHeroBar();
    applyTheme();
  }

  function rerenderSoft() {
    var y = window.scrollY;
    render();
    window.scrollTo(0, y);

  function applyTheme() {
    var th = state.settings.theme;
    if (th === 'auto') {
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme) {
        document.documentElement.setAttribute('data-theme', window.Telegram.WebApp.colorScheme);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    } else {
      document.documentElement.setAttribute('data-theme', th);
    }
  }

  /* ====================================================================

    var today = todayKey();
    var scheduled = getScheduledHabits(today);

    // Группировка привычек по разделам
    var secMap = {};
    state.sections.forEach(function (s) { secMap[s.id] = s; });

    var bySec = {};
    scheduled.forEach(function (h) {
      var sid = h.sectionId || 'other';
      if (!bySec[sid]) bySec[sid] = [];
      bySec[sid].push(h);
    });

    for (var sid in bySec) {
      var sec = secMap[sid] || { name: 'Общее', color: '#0A84FF', icon: 'target' };
      var scard = el('div', 'card');

      // Заголовок раздела

      shead.style.marginBottom = '10px';
      var sleft = el('div', 'row');

      sleft.appendChild(sic);

      stitle.style.color = sec.color;
      sleft.appendChild(stitle);
      shead.appendChild(sleft);
      scard.appendChild(shead);

      // Задачи внутри раздела
      bySec[sid].forEach(function (h) {
        var hrow = renderTodayHabitRow(h, today, sec.color);
        scard.appendChild(hrow);
      });

      v.appendChild(scard);

  function renderTodayHabitRow(habit, today, color) {
    var done = isHabitDone(habit.id, today);
    var val = getHabitVal(habit.id, today);
    var target = habit.target || 1;

    var row = el('div', 'task' + (done ? ' done' : ''));
    row.style.setProperty('--c', color || '#0A84FF');

    // Кнопка-чекбокс (для да/нет или завершения)
    var chk = el('button', 'chk' + (done ? ' on' : ''));
    chk.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
    chk.onclick = function (e) { toggleHabit(habit, e); };
    row.appendChild(chk);

    // Иконка привычки
    var icBox = el('div', 'task-ic');
    icBox.innerHTML = renderIconHtml(habit.icon || 'star', 22);
    row.appendChild(icBox);

    // Текст и детали
    var tbox = el('div', 't');
    tbox.appendChild(el('div', null, habit.name));
    if (habit.reminder) {
      tbox.appendChild(el('div', 'muted small', habit.reminder));
    }
    row.appendChild(tbox);

    // Если это счётчик — кнопки [-] N / Target [+]
    if (habit.type === 'counter') {
      var cbox = el('div', 'cnt-box');
      var btnDec = el('button', 'cnt-btn', '−');
      btnDec.onclick = function (e) { stepCounter(habit, -1, e); };

      var unitStr = habit.unit ? ' ' + habit.unit : '';
      var valTxt = el('span', 'cnt-val', val + ' / ' + target + unitStr);
      cbox.appendChild(valTxt);

      btnInc.onclick = function (e) { stepCounter(habit, 1, e); };
      cbox.appendChild(btnInc);

      row.appendChild(cbox);

    return row;

  function renderWeek(v) {
    v.appendChild(el('h1', null, I18n.t('weekTitle')));

    var ws = weekStart(new Date());
    var weekCard = el('div', 'card');
    var wrow = el('div', 'row sp');
    wrow.style.marginBottom = '14px';

    var days = [];
    var totalWeekDone = 0;
    var dayStats = [];
    var langEn = I18n.getLang() === 'en';

    for (var i = 0; i < 7; i++) {
      var curDate = addDays(ws, i);
      var curKey = dk(curDate);
      var scheduled = getScheduledHabits(curKey);
      var done = scheduled.filter(function (h) { return isHabitDone(h.id, curKey); }).length;
      totalWeekDone += done;
      var pct = scheduled.length ? Math.round((done / scheduled.length) * 100) : 0;
      var isCurToday = curKey === todayKey();

      dayStats.push({
        name: langEn ? DAYN_EN[i] : DAYN[i],
        date: curKey,
        done: done,
        total: scheduled.length,
        pct: pct,
        isToday: isCurToday
      });
    }

    var grid = el('div', 'flame');
    dayStats.forEach(function (ds) {
      var dcol = el('div');
      var box = el('i', (ds.pct >= 100 ? 'on' : '') + (ds.isToday ? ' today' : ''));
      box.textContent = ds.done;
      dcol.appendChild(box);
      dcol.appendChild(el('span', null, ds.name));
      dcol.appendChild(el('div', 'muted small', ds.pct + '%'));
      grid.appendChild(dcol);

    // Итоги недели

    summary.style.marginTop = '14px';

    summary.style.paddingTop = '10px';

    var bestDay = dayStats.slice().sort(function (a, b) { return b.done - a.done; })[0];

      summary.appendChild(el('div', 'muted', I18n.t('weekBestDay', { day: bestDay.name + ' (' + bestDay.done + ')' })));
    }
    weekCard.appendChild(summary);

    v.appendChild(weekCard);

    // 12 недель = 84 дня назад от сегодня
    var startDate = addDays(weekStart(new Date()), -11 * 7);
    for (var col = 0; col < 12 * 7; col++) {
      var d = addDays(startDate, col);
      var dkStr = dk(d);
      var isT = dkStr === todayKey();
      var logsForDay = state.logs[dkStr] || {};
      var doneCount = Object.keys(logsForDay).filter(function (k) { return logsForDay[k] && logsForDay[k].done; }).length;

      var lvlClass = '';
      if (doneCount >= 6) lvlClass = ' l4';
      else if (doneCount >= 4) lvlClass = ' l3';
      else if (doneCount >= 2) lvlClass = ' l2';
      else if (doneCount >= 1) lvlClass = ' l1';

      cell.title = dkStr + ': ' + doneCount;
      hgrid.appendChild(cell);
    }
    hwrap.appendChild(hgrid);
    heatCard.appendChild(hwrap);
    v.appendChild(heatCard);
  }

      tpls.forEach(function (tpl) {

        var tcard = el('div', 'template-item' + (isSel ? ' on' : ''));

        showOnboarding();
      };
      btnRow.appendChild(btnBlank);

      var btnNext2 = el('button', 'btn', I18n.t('onboardingNext'));
      btnNext2.onclick = function () {
        onboardStep = 3;
        showOnboarding();
      };
      btnRow.appendChild(btnNext2);

      screen.appendChild(btnRow);

      ];

  function finishOnboarding() {
    // Применяем выбранные шаблоны
    state.sections = [];
    state.habits = [];

    var tpls = window.TEMPLATES || [];
    selectedTemplates.forEach(function (tid) {
      var tpl = tpls.find(function (x) { return x.id === tid; });
      if (!tpl) return;
      var secId = uid();
      state.sections.push({
        id: secId,
        name: tpl.title_ru,
        color: tpl.color,
        icon: tpl.icon
      });
      tpl.habits.forEach(function (h) {
        state.habits.push({
          id: uid(),
          sectionId: secId,
          name: h.name_ru,
          icon: h.icon,
          days: h.days || 'all',
          type: h.type || 'boolean',
          target: h.target || 1,
          unit: h.unit_ru || '',
          reminder: h.reminder || ''
        });
      });
    });

    state.user.onboarded = true;
    save();
    hideOnboarding();
    celebrate(window.innerWidth / 2, window.innerHeight / 2);
    setHeroSpeech(Content.reply('morning'));
    render();
  }

    inp.placeholder = 'Например: 8 стаканов воды';
    box.appendChild(inp);

    // Раздел
    box.appendChild(el('label', 'muted small', I18n.t('habitSection')));
    var sSelect = el('select', 'input');
    state.sections.forEach(function (s) {
      var opt = el('option', null, s.name);

      if (s.id === hSec) opt.selected = true;

    });

    // Иконка
    box.appendChild(el('label', 'muted small', I18n.t('sectionIcon')));
    var icBtn = el('button', 'icon-preview-btn');
    var icBox = el('div', 'icon-preview-box');
    icBox.innerHTML = renderIconHtml(hIcon, 30);
    icBtn.appendChild(icBox);
    icBtn.appendChild(el('span', null, 'Выбрать иконку'));
    icBtn.onclick = function () {
      openIconPicker(function (newIcon) {
        hIcon = newIcon;
        icBox.innerHTML = renderIconHtml(newIcon, 30);
      });
    };
    box.appendChild(icBtn);

    // Дни недели
    box.appendChild(el('label', 'muted small', I18n.t('habitSchedule')));
    var drow = el('div', 'days-row');
    var isAll = hDays === 'all' || !hDays;
    var curDays = isAll ? [] : (Array.isArray(hDays) ? hDays.slice() : []);

    var btnAll = el('button', 'chip' + (isAll ? ' on' : ''), I18n.t('habitEveryday'));
    btnAll.onclick = function () {
      isAll = true;
      curDays = [];
      updateDaysPaint();
    };
    drow.appendChild(btnAll);

    var dayBtns = [];
    DAYN.forEach(function (dn, i) {
      var b = el('button', 'day-btn' + (curDays.indexOf(i) >= 0 ? ' on' : ''), dn);
      b.onclick = function () {
        isAll = false;
        var p = curDays.indexOf(i);
        if (p >= 0) curDays.splice(p, 1);
        else curDays.push(i);
        if (curDays.length === 7 || curDays.length === 0) {
          isAll = true;
          curDays = [];
        }
        updateDaysPaint();
      };
      dayBtns.push(b);
      drow.appendChild(b);
    });

    function updateDaysPaint() {
      btnAll.classList.toggle('on', isAll);
      dayBtns.forEach(function (b, i) {
        b.classList.toggle('on', curDays.indexOf(i) >= 0);
      });
    }
    box.appendChild(drow);

    // Тип цели
    box.appendChild(el('label', 'muted small', I18n.t('habitType')));
    var tseg = el('div', 'seg');
    var bBool = el('button', hType === 'boolean' ? 'on' : '', I18n.t('habitTypeBool'));
    var bCount = el('button', hType === 'counter' ? 'on' : '', I18n.t('habitTypeCounter'));

    var cntWrap = el('div');
    cntWrap.style.display = hType === 'counter' ? 'block' : 'none';

    bBool.onclick = function () {
      hType = 'boolean';
      bBool.classList.add('on');
      bCount.classList.remove('on');
      cntWrap.style.display = 'none';
    };
    bCount.onclick = function () {
      hType = 'counter';
      bCount.classList.add('on');
      bBool.classList.remove('on');
      cntWrap.style.display = 'block';
    };
    tseg.appendChild(bBool);
    tseg.appendChild(bCount);
    box.appendChild(tseg);

    // Параметры счётчика
    cntWrap.appendChild(el('label', 'muted small', I18n.t('habitTargetVal')));
    var inpTarget = el('input', 'input');
    inpTarget.type = 'number';
    inpTarget.min = '1';
    inpTarget.value = hTarget;
    cntWrap.appendChild(inpTarget);

    cntWrap.appendChild(el('label', 'muted small', I18n.t('habitUnit')));
    var inpUnit = el('input', 'input');
    inpUnit.placeholder = 'стаканов, страниц, минут';
    inpUnit.value = hUnit;
    cntWrap.appendChild(inpUnit);
    box.appendChild(cntWrap);

    // Напоминание / Заметка
    box.appendChild(el('label', 'muted small', I18n.t('habitReminder')));
    var inpRem = el('input', 'input');
    inpRem.placeholder = 'Например: перед выходом из дома';
    inpRem.value = hRem;
    box.appendChild(inpRem);

    // Кнопка Сохранить
    var btnSave = el('button', 'btn', I18n.t('save'));
    btnSave.style.marginTop = '14px';
    btnSave.onclick = function () {
      var n = inp.value.trim();
      if (!n) return;
      var targetVal = parseInt(inpTarget.value, 10) || 1;
      var chosenDays = isAll ? 'all' : curDays.sort();

      if (isEdit) {
        habitToEdit.name = n;
        habitToEdit.sectionId = sSelect.value;
        habitToEdit.icon = hIcon;
        habitToEdit.days = chosenDays;
        habitToEdit.type = hType;
        habitToEdit.target = targetVal;
        habitToEdit.unit = inpUnit.value.trim();
        habitToEdit.reminder = inpRem.value.trim();
      } else {
        state.habits.push({
          id: uid(),
          sectionId: sSelect.value,
          name: n,
          icon: hIcon,
          days: chosenDays,
          type: hType,
          target: targetVal,
          unit: inpUnit.value.trim(),
          reminder: inpRem.value.trim()
        });
        toast(I18n.t('toastHabitAdded'));
      }
      save();
      c.hidden = true;
      c.textContent = '';
      rerenderSoft();
    };
    box.appendChild(btnSave);

    overlay.appendChild(box);
    c.appendChild(overlay);
  }

  /* ====================================================================
     ПИКЕР ИКОНОК (МОИ ИКОНКИ + ЭМОДЗИ + ПОИСК)
     ==================================================================== */
  function openIconPicker(onSelect) {
    var c = $('modalContainer');
    if (!c) return;

    var curPicker = el('div', 'modal-overlay');
    curPicker.style.zIndex = '150';
    var box = el('div', 'modal-box');

    var head = el('div', 'modal-head');
    head.appendChild(el('h2', null, I18n.t('pickerTitle')));
    var btnClose = el('button', 'modal-close', '✕');
    btnClose.onclick = function () { curPicker.remove(); };
    head.appendChild(btnClose);
    box.appendChild(head);

    // Табы: Мои иконки / Эмодзи
    var curTab = 'custom';
    var tseg = el('div', 'seg');
    var bCustom = el('button', 'on', I18n.t('pickerTabCustom') + ' (80)');
    var bEmoji = el('button', '', I18n.t('pickerTabEmoji'));
    tseg.appendChild(bCustom);
    tseg.appendChild(bEmoji);
    box.appendChild(tseg);

    // Поле поиска
    var searchInp = el('input', 'input');
    searchInp.placeholder = I18n.t('pickerSearch');
    box.appendChild(searchInp);

    var grid = el('div', 'icon-grid');
    box.appendChild(grid);

    function paintIcons() {
      grid.textContent = '';
      var query = searchInp.value.trim().toLowerCase();

      if (curTab === 'custom') {
        var catalog = window.ICON_CATALOG || [];
        var filtered = catalog.filter(function (it) {
          if (!query) return true;
          return it.id.toLowerCase().indexOf(query) >= 0 ||
                 it.title_ru.toLowerCase().indexOf(query) >= 0 ||
                 it.title_en.toLowerCase().indexOf(query) >= 0 ||
                 (it.tags && it.tags.some(function (tg) { return tg.indexOf(query) >= 0; }));
        });

        filtered.forEach(function (it) {
          var item = el('div', 'icon-item');
          item.innerHTML = it.svg;
          var lbl = el('span', 'ic-label', it.title_ru);
          item.appendChild(lbl);
          item.onclick = function () {
            onSelect(it.id);
            curPicker.remove();
          };
          grid.appendChild(item);
        });
      } else {
        var filteredEmoji = EMOJIS.filter(function (e) {
          return !query || e.indexOf(query) >= 0;
        });
        filteredEmoji.forEach(function (em) {
          var item = el('div', 'icon-item');
          item.style.fontSize = '26px';
          item.textContent = em;
          item.onclick = function () {
            onSelect(em);
            curPicker.remove();
          };
          grid.appendChild(item);
        });
      }
    }

    bCustom.onclick = function () {
      curTab = 'custom';
      bCustom.classList.add('on');
      bEmoji.classList.remove('on');
      paintIcons();
    };
    bEmoji.onclick = function () {
      curTab = 'emoji';
      bEmoji.classList.add('on');
      bCustom.classList.remove('on');
      paintIcons();
    };
    searchInp.oninput = paintIcons;

    paintIcons();
    curPicker.appendChild(box);
    c.appendChild(curPicker);
  }

  /* ---------- СТАРТ ПРИЛОЖЕНИЯ ---------- */
  /* ---------- КНОПКИ ГЕРОЯ: 💬 реплика, ⤢ крупный питомец ---------- */
  var stopBigHero = null;
  function closeHeroModal() {
    var c = $('modalContainer');
    if (stopBigHero) { try { stopBigHero(); } catch (e) {} stopBigHero = null; }
    if (c) { c.hidden = true; c.textContent = ''; }
  }
  function openHeroModal(mode) {
    var c = $('modalContainer');
    if (!c) return;
    closeHeroModal();
    c.hidden = false;
    var overlay = el('div', 'modal-overlay');
    var box = el('div', 'modal-box');
    var head = el('div', 'modal-head');
    head.appendChild(el('h2', null, mode === 'chat' ? '💬 Питомец говорит' : 'Твой питомец'));
    var x = el('button', 'modal-close', '✕');
    x.onclick = closeHeroModal;
    head.appendChild(x);
    box.appendChild(head);

    var cv = el('canvas');
    cv.width = 96; cv.height = 64;
    cv.style.cssText = 'display:block;margin:6px auto 12px;width:min(300px,80vw);height:auto;image-rendering:pixelated;border-radius:16px';
    box.appendChild(cv);
    try { stopBigHero = Hero.start(cv, heroOpts); } catch (e) { console.warn(e); }

    var bubble = el('div', 'bubble', $('bubble') ? $('bubble').textContent : '');
    bubble.style.cssText = 'text-align:center;margin:0 0 12px';
    box.appendChild(bubble);

    var kinds = ['morning', 'noon', 'evening', 'general', 'done'];
    var more = el('button', 'btn', 'Ещё реплика');
    more.style.cssText = 'width:100%';
    more.onclick = function () {
      var kind = ui.heroMood === 'tired' ? 'tired' : kinds[Math.floor(Math.random() * kinds.length)];
      var t = Content.reply(kind, { section: 'general' });
      bubble.textContent = t;
      setHeroSpeech(t);
      hapticImpact('light');
    };
    box.appendChild(more);
    if (mode === 'chat') more.onclick();

    overlay.onclick = function (e) { if (e.target === overlay) closeHeroModal(); };
    overlay.appendChild(box);
    c.appendChild(overlay);
    hapticImpact('light');
  }
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('#btnChat, #btnBig') : null;
    if (!b) return;
    openHeroModal(b.id === 'btnChat' ? 'chat' : 'big');
  });

  /* Верхний отступ под шапку Telegram (полноэкранный режим) */
  function applyTgInsets() {
    try {
      var w = window.Telegram && Telegram.WebApp;
      if (!w) return;
      var top = ((w.safeAreaInset && w.safeAreaInset.top) || 0) + ((w.contentSafeAreaInset && w.contentSafeAreaInset.top) || 0);
      document.documentElement.style.setProperty('--tg-top', top + 'px');
    } catch (e) {}
  }
  applyTgInsets();
  try {
    var _w = window.Telegram && Telegram.WebApp;
    if (_w && _w.onEvent) {
      _w.onEvent('safeAreaChanged', applyTgInsets);
      _w.onEvent('contentSafeAreaChanged', applyTgInsets);
      _w.onEvent('fullscreenChanged', applyTgInsets);
    }
  } catch (e) {}

  function init() {
    // 1. Инициализация Telegram WebApp
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.onEvent('themeChanged', function () {
          applyTheme();
        });
      }
    } catch (e) {
      console.warn('Telegram init warning:', e);
    }

    // 2. Инициализация эффектов конфетти
    initFx();

    // 3. Загрузка данных
    load(function () {
      render();
      startHero();
      updateHeroMood();
      setHeroSpeech(Content.reply('morning'));

      // Слушатель языка
      window.addEventListener('ritm_lang_changed', function () {
        render();
      });

      // Регистрация Service Worker для офлайн-режима
      if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    });
  }

  window.addEventListener('DOMContentLoaded', init);

  return {
    state: state,
    save: save,
    load: load,
    addXP: addXP,
    celebrate: celebrate,
    toast: toast,
    todayKey: todayKey,
    rerender: render,
    rerenderSoft: rerenderSoft,
    openSectionModal: openSectionModal,
    openHabitModal: openHabitModal,
    openIconPicker: openIconPicker,
    deleteSection: deleteSection,
    deleteHabit: deleteHabit
  };

})();

</script>
</body>
</html>
